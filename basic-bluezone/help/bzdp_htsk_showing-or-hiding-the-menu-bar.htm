<h1 class="title topictitle1">Showing or hiding the menu bar</h1>



<div class="body taskbody"><p class="shortdesc"/>

<ol class="ol steps"><li class="li step"><span class="ph cmd">From the BlueZone menu bar, click <span class="ph menucascade"><span class="ph uicontrol">View</span> → <span class="ph uicontrol">Properties</span></span>. </span></li>
<li class="li step"><span class="ph cmd">On the <span class="ph uicontrol">Menu</span> tab, select or clear
the <span class="ph uicontrol">Show Menubar</span> check box. </span></li>
<li class="li step"><span class="ph cmd">Click <span class="ph uicontrol">OK</span>.</span></li>
</ol>
