<h1 class="title topictitle1">Stopping sessions</h1>



<div class="body taskbody"><p class="shortdesc"/>

<div class="li step p"><span class="ph cmd">From the BlueZone TCP/IP Print Server menu bar, click <span class="ph menucascade"><span class="ph uicontrol">Session</span> → <span class="ph uicontrol"> Stop</span></span>. </span>
<div class="itemgroup stepresult">Or click the <span class="ph uicontrol">Stop Session</span> icon
from the BlueZone TCP/IP Print Server toolbar. <p class="p">When the BlueZone
TCP/IP Print Server is stopped, <samp class="ph systemoutput">Stopped</samp> displays in the status bar. </p>
</div>
</div>
