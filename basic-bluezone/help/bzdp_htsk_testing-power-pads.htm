<h1 class="title topictitle1">Previewing power pads</h1>

will be displayed in the display session. </p>

<ol class="ol steps"><li class="li step stepexpand"><span class="ph cmd">In the editing toolbar, click the <span class="ph uicontrol">Test Pad</span> icon. </span>
<div class="itemgroup stepresult"> A preview of the power pad opens. </div>
</li>
<li class="li step stepexpand"><span class="ph cmd">Close the preview window. </span></li>
</ol>
