<h1 class="title topictitle1">Printing the current screen</h1>



<div class="body taskbody"><p class="shortdesc">The BlueZone Display emulator also has the ability to print
the current screen.  </p>

<div class="li step p"><span class="ph cmd">Click <span class="ph menucascade"><span class="ph uicontrol">File</span> → <span class="ph uicontrol"> Print
Screen </span></span> from the BlueZone menu bar or click
the <span class="ph uicontrol">Print Screen</span> icon from the BlueZone toolbar. </span>
</div>

</div>
