version: '3.6'
services:
  unleash-server:
    image: unleashorg/unleash-server:3.11.0-node14-alpine
    ports:
      - 4242:4242
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/unleash
      HTTP_PORT: 4242
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:12.1-alpine
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5  
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: unleash
