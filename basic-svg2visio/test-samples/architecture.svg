<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
  </defs>

  <!-- Client Layer -->
  <rect x="50" y="30" width="700" height="80" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
  <text x="400" y="55" text-anchor="middle" fill="#1565C0" font-size="14" font-weight="bold">Client Layer</text>
  <rect x="100" y="65" width="120" height="35" rx="5" fill="#BBDEFB" stroke="#1976D2" stroke-width="1"/>
  <text x="160" y="87" text-anchor="middle" fill="#1565C0" font-size="12">Web App</text>
  <rect x="260" y="65" width="120" height="35" rx="5" fill="#BBDEFB" stroke="#1976D2" stroke-width="1"/>
  <text x="320" y="87" text-anchor="middle" fill="#1565C0" font-size="12">Mobile App</text>
  <rect x="420" y="65" width="120" height="35" rx="5" fill="#BBDEFB" stroke="#1976D2" stroke-width="1"/>
  <text x="480" y="87" text-anchor="middle" fill="#1565C0" font-size="12">CLI Tool</text>

  <!-- API Gateway -->
  <rect x="250" y="160" width="300" height="50" rx="8" fill="#FFF3E0" stroke="#E65100" stroke-width="2"/>
  <text x="400" y="190" text-anchor="middle" fill="#E65100" font-size="14" font-weight="bold">API Gateway</text>

  <!-- Service Layer -->
  <rect x="50" y="260" width="700" height="80" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/>
  <text x="400" y="282" text-anchor="middle" fill="#2E7D32" font-size="14" font-weight="bold">Microservices</text>
  <rect x="80" y="295" width="130" height="35" rx="5" fill="#C8E6C9" stroke="#388E3C" stroke-width="1"/>
  <text x="145" y="317" text-anchor="middle" fill="#2E7D32" font-size="12">Auth Service</text>
  <rect x="240" y="295" width="130" height="35" rx="5" fill="#C8E6C9" stroke="#388E3C" stroke-width="1"/>
  <text x="305" y="317" text-anchor="middle" fill="#2E7D32" font-size="12">User Service</text>
  <rect x="400" y="295" width="130" height="35" rx="5" fill="#C8E6C9" stroke="#388E3C" stroke-width="1"/>
  <text x="465" y="317" text-anchor="middle" fill="#2E7D32" font-size="12">Order Service</text>
  <rect x="560" y="295" width="160" height="35" rx="5" fill="#C8E6C9" stroke="#388E3C" stroke-width="1"/>
  <text x="640" y="317" text-anchor="middle" fill="#2E7D32" font-size="12">Notification Svc</text>

  <!-- Data Layer -->
  <rect x="100" y="400" width="150" height="60" rx="8" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2"/>
  <text x="175" y="435" text-anchor="middle" fill="#6A1B9A" font-size="13">PostgreSQL</text>
  <rect x="320" y="400" width="150" height="60" rx="8" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2"/>
  <text x="395" y="435" text-anchor="middle" fill="#6A1B9A" font-size="13">Redis Cache</text>
  <rect x="540" y="400" width="150" height="60" rx="8" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2"/>
  <text x="615" y="435" text-anchor="middle" fill="#6A1B9A" font-size="13">S3 Storage</text>

  <!-- Arrows -->
  <line x1="400" y1="110" x2="400" y2="160" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="400" y1="210" x2="400" y2="260" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="175" y1="340" x2="175" y2="400" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="395" y1="340" x2="395" y2="400" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="615" y1="340" x2="615" y2="400" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
