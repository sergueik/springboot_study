<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>
  <style>
    .frame{fill:#F7FBFF;stroke:#0078D4;stroke-width:2;stroke-dasharray:8 5}
    .box{fill:#FFFFFF;stroke:#333333;stroke-width:1.5}
    .hdr{font-size:18px;font-weight:bold;fill:#009640}
    .lbl{font-size:14px;fill:#333333}
    .sub{font-size:11px;fill:#777777}
    .link{stroke:#009640;stroke-width:2.5;fill:none}
  </style>

  <text x="20" y="30" class="hdr">Title left aligned</text>

  <g transform="translate(0,50)">
    <rect x="40" y="40" width="500" height="220" rx="10" class="frame"/>
    <text x="55" y="65" class="lbl">Frame label</text>

    <rect x="80" y="100" width="160" height="90" rx="6" class="box"/>
    <text x="160" y="130" text-anchor="middle" class="hdr">Node A</text>
    <text x="160" y="155" text-anchor="middle" class="sub">detail line</text>

    <rect x="340" y="100" width="160" height="90" rx="6" class="box"/>
    <text x="420" y="130" text-anchor="middle" class="hdr">Node B</text>

    <path d="M240 145 L340 145" class="link" marker-end="url(#arr)"/>
  </g>
</svg>
