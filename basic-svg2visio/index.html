<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG to Visio Converter</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            text-align: center;
            padding: 2rem 1rem 1rem;
        }
        header h1 {
            font-size: 2rem;
            background: linear-gradient(135deg, #d4a574, #e8c9a0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }
        header p { color: #888; font-size: 0.95rem; }

        .container {
            width: 100%;
            max-width: 900px;
            padding: 1rem;
        }

        .drop-zone {
            border: 2px dashed #444;
            border-radius: 12px;
            padding: 3rem 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: #16213e;
            margin-bottom: 1.5rem;
        }
        .drop-zone:hover, .drop-zone.dragover {
            border-color: #d4a574;
            background: #1a2744;
        }
        .drop-zone .icon { font-size: 3rem; margin-bottom: 1rem; }
        .drop-zone p { color: #aaa; margin: 0.3rem 0; }
        .drop-zone .browse { color: #d4a574; text-decoration: underline; cursor: pointer; }

        .or-divider {
            text-align: center;
            color: #555;
            margin: 1rem 0;
            font-size: 0.9rem;
        }

        .paste-area {
            width: 100%;
            min-height: 150px;
            background: #0f1629;
            border: 1px solid #333;
            border-radius: 8px;
            color: #ccc;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            padding: 1rem;
            resize: vertical;
            margin-bottom: 1rem;
        }
        .paste-area:focus { outline: none; border-color: #d4a574; }

        .btn {
            display: inline-block;
            padding: 0.7rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #d4a574, #c9956a);
            color: #1a1a2e;
            font-weight: 600;
        }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 15px rgba(212,165,116,0.3); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .actions {
            display: flex;
            gap: 1rem;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .preview-section {
            background: #16213e;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            display: none;
        }
        .preview-section h3 { margin-bottom: 1rem; color: #d4a574; }
        .preview-container {
            background: white;
            border-radius: 8px;
            padding: 1rem;
            text-align: center;
            overflow: auto;
            max-height: 500px;
        }
        .preview-container svg { max-width: 100%; height: auto; }

        .stats {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin-top: 1rem;
        }
        .stat-badge {
            background: #1a2744;
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            font-size: 0.85rem;
            color: #aaa;
        }
        .stat-badge span { color: #d4a574; font-weight: 600; }

        .log {
            background: #0f1629;
            border-radius: 8px;
            padding: 1rem;
            font-family: monospace;
            font-size: 0.8rem;
            max-height: 200px;
            overflow-y: auto;
            display: none;
            margin-bottom: 1rem;
        }
        .log .info { color: #6ec6ff; }
        .log .success { color: #69f0ae; }
        .log .warn { color: #ffd54f; }
        .log .error { color: #ff5252; }

        #fileInput { display: none; }
    </style>
</head>
<body>
    <header>
        <h1>SVG &amp; Draw.io to Visio Converter</h1>
        <p>Convert SVG diagrams and Draw.io files to editable Visio (.vsdx) files</p>
    </header>

    <div class="container">
        <div class="drop-zone" id="dropZone">
            <div class="icon">&#128196;</div>
            <p>Drag &amp; drop an SVG or .drawio file here</p>
            <p class="browse" id="browseBtn">or click to browse</p>
        </div>

        <div class="or-divider">- or paste SVG / Draw.io XML code below -</div>

        <textarea class="paste-area" id="svgInput" placeholder="Paste your SVG or Draw.io XML here...&#10;&#10;SVG: <svg xmlns=&quot;...&quot; viewBox=&quot;0 0 800 600&quot;>...</svg>&#10;Draw.io: <mxfile>...<mxGraphModel>...</mxGraphModel>...</mxfile>"></textarea>

        <div class="actions">
            <button class="btn btn-primary" id="convertBtn" disabled>Convert to .vsdx</button>
            <span id="statusText" style="color:#888; font-size:0.9rem;"></span>
        </div>

        <div class="log" id="log"></div>

        <div class="preview-section" id="previewSection">
            <h3>SVG Preview</h3>
            <div class="preview-container" id="previewContainer"></div>
            <div class="stats" id="stats"></div>
        </div>
    </div>

    <input type="file" id="fileInput" accept=".svg,.drawio,.xml,image/svg+xml">

    <script src="svg-parser.js"></script>
    <script src="drawio-parser.js"></script>
    <script src="vsdx-builder.js"></script>
    <script src="app.js"></script>
</body>
</html>
