kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
  # Direct mapping instructions to Docker runtime
  extraContainerRuntimeArgs:
  - "--memory=3g"
  - "--memory-swap=6g" # Gives container 3GB RAM + access to 3GB Swap
  extraPortMappings:
  - containerPort: 30443
    hostPort: 8443
    protocol: TCP

kubeadmConfigPatches:
- |
  apiVersion: kubeadm.k8s.io/v1beta3
  kind: ClusterConfiguration
  apiServer:
    extraArgs:
      max-requests-inflight: "50"
    
