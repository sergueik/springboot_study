apiVersion: v1
kind: Service
metadata:
  name: {{ include "my-chart.fullname" . }}-probe-example
  labels:
  {{- include "my-chart.labels" . | nindent 4 }}
spec:
  type: {{ .Values.probeExample.type }}
  selector:
    app: probe-example
  {{- include "my-chart.selectorLabels" . | nindent 4 }}
  ports:
	{{- .Values.probeExample.ports | toYaml | nindent 2 }}